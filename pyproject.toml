[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "flowbridge-code-manager"
version = "0.1.0"
description = "Python source acquisition and original-source retrieval for FlowBridge"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<0.29",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
flowbridge-code = "flowbridge.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = [
    "FlowBridgeBackend",
    "FlowBridge_ParsingAndAnalysis/src/flowbridge_analysis",
    "flowbridge",
]

[tool.hatch.build.targets.wheel.force-include]
"CodeManager.py" = "CodeManager.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["FlowBridgeBackend", "flowbridge", "flowbridge_analysis"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["ALL"]
