<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FlowBridge Login Page</title>
        <link rel="stylesheet" href="FlowBridge.css">
    </head>
    <body>
        <!-- Top Navigation Bar -->
        <header class="heading">
            <div class="headingLeft">
                <img src="FlowBridgeIcon.png" alt="Logo Icon" class="logoIcon">
                <span class="brandName">FlowBridge</span>
            </div>
        </header>
        <main>
            <form method="post">
                <div class="card">
                    <label for="userName"><b>Username</b></label>
                    <input type="text" placeholder="Enter Username" name="userName" required>
                </div>
                <div class="card">
                    <label for="passWord"><b>Password</b></label>
                    <input type="password" placeholder="Enter Password" name="psw" required>
                    <button type="submit">Login</button>
                </div>
                <button type="submit">Login</button>
                <div class="contentGrid">
                    <span class="passWord"><a href="#">Forgot password?</a></span>
                    <span class="passWord"><a href="#">Don't have an account?</a></span>
                </div>
            </form>
        </main>
    </body>
</html>
